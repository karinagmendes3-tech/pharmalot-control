<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produção - Controle de Lotes Opcenter</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo-area">
            <img src="/images/logo.png" alt="Logo">
            <h2>Opcenter</h2>
        </div>

        <nav class="menu">
            <a href="/">Home</a>
            <a href="/logbook">Logbook</a>
            <a href="/producao">Produção</a>
            <a href="/equipamentos">Equipamentos</a>
            <a href="/historico">Histórico</a>
            <a href="/relatorios">Relatórios</a>
            <a href="/administracao">Administração</a>
        </nav>
    </aside>

    <main class="content">

        <h1>Produção</h1>
        <p>Busque uma OP para preencher automaticamente os dados disponíveis.</p>

        <form action="/producao/buscar" method="get">
            <input type="text"
                   name="numeroOp"
                   placeholder="Digite o número da OP"
                   required>

            <button type="submit">Buscar OP</button>
        </form>

        <div th:if="${ordem != null}">

            <p th:if="${encontrada}">
                OP encontrada na base.
            </p>

            <p th:if="${encontrada == false}">
                OP não encontrada. Preencha os dados manualmente.
            </p>

            <form>

                <label>OP</label>
                <input type="text"
                       th:value="${ordem.numeroOp}">

                <label>Código do Produto</label>
                <input type="text"
                       th:value="${ordem.codigoProduto}">

                <label>Descrição do Produto</label>
                <input type="text"
                       th:value="${ordem.descricaoProduto}">

                <label>Lote</label>
                <input type="text"
                       th:value="${ordem.lote}">

                <label>Status da OP</label>
                <input type="text"
                       th:value="${ordem.statusOp}">

                <hr>

                <h2>Nova etapa produtiva</h2>

                <label>Etapa</label>
                <select>
                    <option>Pesagem</option>
                    <option>Manipulação</option>
                    <option>Compressão</option>
                    <option>Revestimento</option>
                    <option>Acondicionamento</option>
                </select>

                <label>Status do Processo</label>
                <select>
                    <option>Em andamento</option>
                    <option>Concluído</option>
                    <option>Abandonado</option>
                    <option>Interrompido</option>
                </select>

                <label>Quantidade de Desvios</label>
                <input type="number" value="0">

                <label>Operador</label>
                <input type="text">

                <label>Observação / Motivo</label>
                <textarea></textarea>

                <button type="submit">
                    Salvar Registro
                </button>

            </form>

        </div>

    </main>

</div>

</body>
</html>
