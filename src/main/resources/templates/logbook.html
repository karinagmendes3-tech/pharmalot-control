<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logbook - Áreas</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<div class="main-content">
    <h1>Logbook por Área</h1>
    <p>Selecione a área produtiva desejada.</p>

    <div class="cards-container">

        <a class="card"
           th:each="area : ${areas}"
           th:href="@{'/logbook/' + ${area['url']}}">

            <h3 th:text="${area['nome']}">Área</h3>
            <p th:text="${area['descricao']}">Descrição</p>

        </a>

    </div>
</div>

</body>
</html>
