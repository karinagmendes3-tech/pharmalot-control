<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CONTROLE DE LOTES OPCENTER</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-container">

    <div class="login-panel">
        <div class="left-content">
            <div class="quote">“</div>
            <h2>Precisão, controle<br>e excelência<br><span>operacional.</span></h2>
            <div class="line"></div>
            <p>Tecnologia que<br>transforma resultados.</p>
        </div>
    </div>

    <div class="login-area">
        <div class="login-card">
            <img src="/images/logo.png" alt="Logo" class="logo">

            <h3>Bem-vindo de volta!</h3>
            <p class="subtitle">Acesse sua conta para continuar.</p>

            <form method="post" action="/login">
                <input type="text" name="username" placeholder="Usuário" required>
                <input type="password" name="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <p class="footer">© 2026 OPCENTER TEUTO. Todos os direitos reservados.</p>
    </div>

</div>
</body>
</html>
